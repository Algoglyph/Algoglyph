<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Metadata -->
    <title>Terms of Service | AlgoGlyph</title>
    <meta name="description" content="Read the terms of service and conditions for using the AlgoGlyph workspace, applications, and tools." />
    <meta name="keywords" content="terms of service, terms and conditions, user agreement, AlgoGlyph terms" />
    <meta name="author" content="AlgoGlyph" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://algoglyph.com/terms" />

    <!-- Theme & Display Configuration -->
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Icons & Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://algoglyph.com/terms" />
    <meta property="og:title" content="Terms of Service | AlgoGlyph" />
    <meta property="og:description" content="Read the terms of service and conditions for using the AlgoGlyph workspace, applications, and tools." />
    <meta property="og:image" content="https://algoglyph.com/og-image.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="AlgoGlyph" />
    <meta property="og:site_name" content="AlgoGlyph" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://algoglyph.com/terms" />
    <meta name="twitter:title" content="Terms of Service | AlgoGlyph" />
    <meta name="twitter:description" content="Read the terms of service and conditions for using the AlgoGlyph workspace, applications, and tools." />
    <meta name="twitter:image" content="https://algoglyph.com/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />



    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "https://algoglyph.com/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Terms",
            "item": "https://algoglyph.com/terms"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/terms.tsx"></script>
  </body>
</html>
